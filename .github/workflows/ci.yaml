name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f Dockerfile
          test -f charts/kanban/Chart.yaml
          test -f charts/kanban/values.yaml

      - name: Check HTML structure
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          grep -q "<script" index.html

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/kanban

      - name: Render Helm chart
        run: |
          helm template taskflow charts/kanban \
            -f charts/kanban/values/dev.yaml \
            > /tmp/taskflow-rendered.yaml

      - name: Verify rendered manifests
        run: test -s /tmp/taskflow-rendered.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taskflow-kanban:ci

      - name: Run container
        run: |
          docker run -d \
            --name taskflow-kanban \
            -p 8080:80 \
            taskflow-kanban:ci

      - name: Check container response
        run: |
          sleep 3
          curl --fail http://localhost:8080

      - name: Show container logs on failure
        if: failure()
        run: docker logs taskflow-kanban