apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/iagooteroc/kanban-platform.git
    targetRevision: main
    path: charts/kanban
    helm:
      valueFiles:
        - values/dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true