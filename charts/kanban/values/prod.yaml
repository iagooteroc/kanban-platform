replicaCount: 3

image:
  repository: taskflow-kanban
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: http

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: kanban.example.local
  path: /